name: CI

# Corre en cada push a main y en cada PR. Valida que el backend pase sus tests y
# que el frontend compile antes de que Railway despliegue.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # El lint va ANTES del build y falla el job: hasta ahora no corría en ningún
      # lado, así que se había acumulado hasta 330 errores sin que nadie se enterara.
      # Corriendo acá, el próximo que aparezca se ve en el PR y no dentro de un año.
      # Nota: `ng test` NO está acá a propósito — los 14 specs son plantillas que el
      # CLI generó al crear cada página y nunca se completaron (13 de 14 fallan por
      # falta de providers). Meterlos dejaría el pipeline rojo de entrada, que es la
      # forma más rápida de que el equipo aprenda a ignorarlo.
      - run: npm run lint
      - run: npm run build
