name: CI

# Corre en cada push a main y en cada PR. Valida que el backend pase sus tests y
# que el frontend compile antes de que Railway despliegue.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres real para test/pg-adaptador.test.js: los errores de dialecto y de tipos
    # de la migración desde MySQL no se ven contra una base falsa. Misma versión mayor
    # que en Railway. La base termina en _test porque el test borra el esquema entero
    # y se niega a correr contra cualquier otra.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: motiq
          POSTGRES_PASSWORD: motiq_ci
          POSTGRES_DB: motiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U motiq -d motiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://motiq:motiq_ci@localhost:5432/motiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  empresas:
    # Con el mismo motor que producción, y con el servidor de verdad: si una empresa llega
    # a ver o tocar algo de otra, esto queda en rojo y no se despliega.
    name: Backend · dos empresas separadas (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: motiq
          POSTGRES_PASSWORD: motiq_ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U motiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:empresas
        env:
          E2E_PG_URL: postgres://motiq:motiq_ci@localhost:5432/postgres

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    # Los 12 flujos críticos de punta a punta con Playwright, en Chromium headless.
    # Playwright levanta el backend (3201, crea la base si falta y la migra al
    # arrancar) y el build del frontend servido en 4310 con /api hacia el backend.
    # Cada worker crea su propio taller por POST /api/onboarding.
    name: E2E · 12 flujos críticos (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: motiq
          POSTGRES_PASSWORD: motiq_ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U motiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://motiq:motiq_ci@localhost:5432/motiq_t11_e2e
      JWT_SECRET: secreto-solo-para-e2e-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Compilar el frontend (la suite sirve frontend/www)
        run: npm run build
        working-directory: frontend
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Correr la suite
        run: npx playwright test
        working-directory: e2e
      - name: Guardar reporte y trazas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
