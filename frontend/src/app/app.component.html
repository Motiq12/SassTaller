<ion-app [class.con-nav-portal]="navPortal">
  <!-- Menú lateral del portal del cliente: solo se ve en pantallas anchas. -->
  <app-portal-nav *ngIf="navPortal" [url]="url"></app-portal-nav>

  <!-- Banner global de sin conexión -->
  <div class="net-banner" *ngIf="!enLinea" role="status" aria-live="polite">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    Sin conexión — mostrando datos guardados
  </div>

  <ion-router-outlet></ion-router-outlet>
</ion-app>
