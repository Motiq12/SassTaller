<ion-app [class.con-aviso-sistema]="!!avisoVisible">
  <!-- Aviso de Motiq hacia el personal del taller (admin/recepción/mecánico). Arriba
       de todo, y no en cada shell por separado: así vale para cualquier pantalla sin
       tener que engancharlo en admin-shell, recepcion-tabs, mecanico-tabs y tabs a la
       vez. Se cierra una vez y no vuelve — un aviso nuevo sí se le muestra.

       La clase en <ion-app> corre ion-router-outlet hacia abajo (ver global.scss):
       sin eso, la franja queda flotando ENCIMA del contenido y tapa el logo de la
       barra lateral de cada shell en vez de empujarlo. -->
  <div [class]="claseAviso()" *ngIf="avisoVisible" role="status" aria-live="polite">
    <ion-icon [name]="iconoAviso()"></ion-icon>
    <span [title]="avisoVisible.mensaje">{{ avisoVisible.mensaje }}</span>
    <button type="button" (click)="cerrarAviso()" aria-label="Cerrar aviso">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <!-- Banner global de sin conexión -->
  <div class="net-banner" *ngIf="!enLinea" role="status" aria-live="polite">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    Sin conexión — mostrando datos guardados
  </div>

  <!-- "Algo no funciona" hacia Motiq — la otra mitad de la pareja con el aviso de
       arriba. Abajo a la derecha, por encima de donde vive un FAB normal (ver
       .reportar-falla en global.scss): a la izquierda tapaba el pie de sesión de la
       barra lateral fija de admin-shell y compañía, y a la misma altura que un FAB
       existente se hubiera superpuesto con "nueva orden"/"nueva cita". -->
  <button type="button" class="reportar-falla" *ngIf="esStaff" (click)="reportarProblema()"
          aria-label="Reportar un problema" title="Reportar un problema">
    <ion-icon name="bug-outline"></ion-icon>
  </button>

  <ion-router-outlet></ion-router-outlet>
</ion-app>
