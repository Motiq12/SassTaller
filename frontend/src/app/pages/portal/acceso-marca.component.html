<section class="marca">
  <!-- El logo del taller, no un archivo de la app: app-marca-logo pinta el que
       cargó el taller y, si no cargó ninguno, sus iniciales. -->
  <app-marca-logo class="marca-logo" [tamano]="72"></app-marca-logo>

  <!-- De vuelta a la página de Motiq. Solo en la puerta del producto: en el portal de
       un taller, «/» es la página de venta de Motiq y no la de ese taller. -->
  <a *ngIf="marca.esProducto" class="marca-volver" routerLink="/">
    <ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon> Volver al inicio
  </a>

  <!-- La figura va en su propia zona y entera. Como fondo a pantalla completa quedaba
       recortada y con el titular encima, sin importar lo bien que estuviera dibujada. -->
  <img class="marca-figura" src="assets/portal/taller-iso.webp" alt="" />

  <div class="marca-cuerpo">
    <span class="marca-rotulo">Portal de {{ marca.rotuloPublico }}</span>
    <h2 class="marca-titulo">Tu vehículo, <span>en buenas manos.</span></h2>

    <ol class="marca-lista">
      <li *ngFor="let p of puntos; let i = index">
        <span class="marca-n">{{ (i + 1).toString().padStart(2, '0') }}</span>
        <span><strong>{{ p.titulo }}</strong>{{ p.texto }}</span>
      </li>
    </ol>
  </div>
</section>
