<ion-header>
  <ion-toolbar class="admin-topbar">
    <ion-title>Mis vehículos</ion-title>
    <app-portal-actions slot="end"></app-portal-actions>
  </ion-toolbar>
</ion-header>

<ion-content class="admin-dark">
  <ion-refresher slot="fixed" (ionRefresh)="cargar(); $event.target.complete()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="motos">
    <div class="intro">
      <h2>Mi Garaje</h2>
      <p>Tus vehículos, su historial y cuándo les toca servicio.</p>
    </div>

    <div *ngIf="cargando" style="display:flex;flex-direction:column;gap:10px">
      <div class="skeleton" style="height:96px"></div>
      <div class="skeleton" style="height:96px"></div>
    </div>

    <!-- Lista de motos (cada tarjeta abre el perfil) -->
    <div class="moto-list" *ngIf="!cargando && motos.length">
      <div class="mc" *ngFor="let m of motos" (click)="verHistorial(m)">
        <div class="mc-i" [class.has-foto]="m.foto">
          <img *ngIf="m.foto; else mcIcon" [src]="m.foto" [alt]="m.marca + ' ' + m.modelo">
          <ng-template #mcIcon><ion-icon name="car"></ion-icon></ng-template>
        </div>
        <div class="mc-m">
          <h4>{{ m.marca }} {{ m.modelo }}</h4>
          <div class="mc-tags">
            <span class="mc-plate mono" *ngIf="m.placa">{{ m.placa }}</span>
            <span class="mc-km mono" *ngIf="m.kilometraje_actual">{{ m.kilometraje_actual | number }} km</span>
          </div>
          <span class="mc-aviso" [ngClass]="avisoMoto(m).tono"><i></i>{{ avisoMoto(m).texto }}</span>
        </div>
        <div class="mc-acts" (click)="$event.stopPropagation()">
          <button class="mc-e" (click)="editar(m)" title="Editar" aria-label="Editar vehículo"><ion-icon name="create-outline"></ion-icon></button>
          <button class="mc-e del" (click)="eliminar(m)" title="Eliminar" aria-label="Eliminar vehículo"><ion-icon name="trash-outline"></ion-icon></button>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="!cargando && motos.length === 0 && !mostrarForm">
      <ion-icon name="car-outline"></ion-icon>
      <p>Todavía no registraste ningún vehículo.</p>
    </div>

    <!-- Botón agregar -->
    <button class="cta-o" (click)="abrirForm()" *ngIf="!mostrarForm">
      <ion-icon name="add-outline"></ion-icon> Agregar vehículo
    </button>

    <!-- Formulario -->
    <section class="cd" *ngIf="mostrarForm">
      <span class="lb">{{ editandoId ? 'Editar vehículo' : 'Registrar nuevo vehículo' }}</span>

      <!-- Foto de la moto (opcional) -->
      <div class="moto-foto">
        <div class="mf-prev" [class.empty]="!nueva.foto" (click)="!procesandoFoto && fotoInput.click()">
          <img *ngIf="nueva.foto; else mfPlace" [src]="nueva.foto" alt="Foto del vehículo">
          <ng-template #mfPlace>
            <ion-icon [name]="procesandoFoto ? 'hourglass-outline' : 'camera-outline'"></ion-icon>
          </ng-template>
        </div>
        <div class="mf-actions">
          <button type="button" class="mf-btn" (click)="fotoInput.click()" [disabled]="procesandoFoto">
            {{ nueva.foto ? 'Cambiar foto' : 'Agregar foto' }}
          </button>
          <button type="button" class="mf-btn del" *ngIf="nueva.foto" (click)="quitarFoto()" [disabled]="procesandoFoto">Quitar</button>
        </div>
        <input #fotoInput type="file" accept="image/*" hidden (change)="onFoto($event)">
      </div>

      <div class="fg" *ngIf="tipos.length > 1">
        <label for="tipo-vehiculo">Tipo de vehículo *</label>
        <select id="tipo-vehiculo" [(ngModel)]="nueva.tipo" name="tipo" (ngModelChange)="cambiarTipo()">
          <option value="" disabled>Elige el tipo</option>
          <option *ngFor="let t of tipos" [ngValue]="t.clave">{{ t.etiqueta }}</option>
        </select>
      </div>

      <div class="fg"><label>Placa *</label><input class="upper" [(ngModel)]="nueva.placa" name="placa" placeholder="ABC-123"></div>

      <div class="fg ac-field">
        <label>Marca *</label>
        <input [(ngModel)]="nueva.marca" name="marca" (ngModelChange)="onMarcaInput()" placeholder="Ej: Toyota" autocomplete="off">
        <div class="ac-results" *ngIf="marcasSugeridas.length">
          <button type="button" class="ac-item" *ngFor="let m of marcasSugeridas" (click)="seleccionarMarca(m)">{{ m }}</button>
        </div>
      </div>

      <div class="fg ac-field">
        <label>Modelo *</label>
        <input [(ngModel)]="nueva.modelo" name="modelo" (ngModelChange)="onModeloInput()" (focus)="onModeloFocus()" placeholder="Ej: Hilux" autocomplete="off">
        <div class="ac-results" *ngIf="modelosSugeridos.length">
          <button type="button" class="ac-item" *ngFor="let m of modelosSugeridos" (click)="seleccionarModelo(m)">{{ m }}</button>
        </div>
      </div>
      <div class="fg"><label>Año (opcional)</label><input type="number" inputmode="numeric" [(ngModel)]="nueva.anio" name="anio" placeholder="2024"></div>
      <div class="fg"><label>Color (opcional)</label><input [(ngModel)]="nueva.color" name="color" placeholder="Ej: Rojo"></div>
      <div class="fg"><label>Kilometraje (opcional)</label><input type="number" inputmode="numeric" [(ngModel)]="nueva.kilometraje" name="kilometraje" placeholder="15000"></div>

      <!-- Los datos propios de cada tipo: pasajeros de un bus, ejes de un camión… -->
      <ng-container *ngIf="tipoActual as t">
        <div class="fg" *ngFor="let c of t.campos">
          <label [attr.for]="'campo-' + c.clave">{{ c.etiqueta }} (opcional)</label>
          <select *ngIf="c.tipo === 'opcion'" [id]="'campo-' + c.clave" [(ngModel)]="atributos[c.clave]" [name]="'attr_' + c.clave">
            <option [ngValue]="undefined">Sin indicar</option>
            <option *ngFor="let o of c.opciones" [ngValue]="o">{{ o }}</option>
          </select>
          <input *ngIf="c.tipo === 'numero'" type="number" inputmode="numeric" [id]="'campo-' + c.clave"
                 [attr.min]="c.min" [attr.max]="c.max" [(ngModel)]="atributos[c.clave]" [name]="'attr_' + c.clave">
          <input *ngIf="c.tipo !== 'opcion' && c.tipo !== 'numero'" [id]="'campo-' + c.clave"
                 maxlength="120" [(ngModel)]="atributos[c.clave]" [name]="'attr_' + c.clave">
        </div>
      </ng-container>

      <button class="cta" (click)="guardar()" [disabled]="!valido || enviando">
        <ion-spinner *ngIf="enviando" name="crescent"></ion-spinner>
        {{ enviando ? 'Guardando…' : (editandoId ? 'Guardar cambios' : 'Guardar vehículo') }}
      </button>
      <button class="cta-o" (click)="cerrarForm()" [disabled]="enviando">Cancelar</button>
    </section>

    <div style="height:30px"></div>
  </div>
</ion-content>
