<ion-content class="legal">
  <div class="pagina">
    <header class="barra">
      <a routerLink="/" class="marca" aria-label="Motiq, volver al inicio">
        <img [src]="producto.logo" alt="" width="30" height="30" />
        <span>{{ producto.nombre }}</span>
      </a>
      <nav aria-label="Documentos legales" class="docs">
        <a routerLink="/legal/terminos" [class.actual]="clave === 'terminos'"
           [attr.aria-current]="clave === 'terminos' ? 'page' : null">Términos</a>
        <a routerLink="/legal/privacidad" [class.actual]="clave === 'privacidad'"
           [attr.aria-current]="clave === 'privacidad' ? 'page' : null">Privacidad</a>
      </nav>
    </header>

    <article>
      <h1>{{ doc.titulo }}</h1>
      <p class="bajada">{{ doc.bajada }}</p>
      <p class="fecha">Actualizado en {{ doc.actualizado }}. Versión preliminar, en revisión legal.</p>

      <section *ngFor="let s of doc.secciones">
        <h2>{{ s.titulo }}</h2>
        <p *ngFor="let p of s.parrafos">{{ p }}</p>
      </section>
    </article>

    <footer class="pie">
      <a routerLink="/">Volver a {{ producto.nombre }}</a>
      <a routerLink="/registro-taller">Registrar mi taller</a>
    </footer>
  </div>
</ion-content>
