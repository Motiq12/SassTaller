<section class="hero" aria-labelledby="hero-titulo">
  <!-- El motivo: un círculo plano carmesí y, delante, el disco de freno en 3D. -->
  <div class="escena" aria-hidden="true">
    <div class="plato"></div>
    <canvas #lienzo class="lienzo" [class.listo]="con3d"></canvas>
  </div>

  <div class="texto">
    <h1 id="hero-titulo" lpAparece>El taller ordenado, sin cuadernos.</h1>
    <p class="bajada" lpAparece [retraso]="80">
      {{ producto.nombre }} lleva las órdenes de trabajo, los clientes y la agenda de tu taller
      en un solo lugar, sin grupos de WhatsApp. Para motos, autos o lo que atiendas.
    </p>
    <div class="acciones" lpAparece [retraso]="160">
      <a class="principal" routerLink="/registro-taller">Probá gratis</a>
      <button type="button" class="secundario" (click)="hablar.emit()">Hablá con nosotros</button>
    </div>
    <p class="chica" lpAparece [retraso]="220">Sin tarjeta. Se arma en menos de 5 minutos.</p>
  </div>
</section>
