<section class="hero" aria-labelledby="hero-titulo">
  <!-- El disco: primero la imagen fija (un cuadro del mismo render) y, cuando está
       listo, el 3D en vivo encima. -->
  <div class="escena" aria-hidden="true">
    <img class="foto" [class.con3d]="con3d" src="assets/landing/disco-freno.webp" alt=""
         width="1170" height="1170" decoding="async" />
    <canvas #lienzo class="lienzo" [class.listo]="con3d"></canvas>
  </div>

  <div class="texto">
    <h1 id="hero-titulo">El taller ordenado, <span class="junto">sin cuadernos.</span></h1>
    <!-- El resultado, no la lista de funciones: cada vehículo con su orden, el cliente
         que aprueba y sigue el trabajo solo, y el dueño que deja de contestar. -->
    <p class="bajada">
      Cada vehículo entra con su orden, el cliente aprueba el presupuesto desde el celular
      y sigue el trabajo sin escribirte por WhatsApp. Para motos, autos o los dos.
    </p>
    <div class="acciones">
      <a class="principal" routerLink="/registro-taller">Probá gratis 30 días</a>
      <button type="button" class="secundario" (click)="hablar.emit()">Hablá con nosotros</button>
    </div>
    <p class="chica">Sin tarjeta. Después sigue gratis y no se borra nada.</p>
  </div>
</section>
