<section class="confianza" aria-labelledby="confianza-titulo">
  <div class="cabeza">
    <p class="rotulo" appAparece>Por qué confiar</p>
    <h2 id="confianza-titulo" class="titulo" appAparece>
      <span class="l"><span style="--i: 0">Tu información,</span></span>
      <span class="l"><span style="--i: 1">cuidada</span></span>
    </h2>
  </div>

  <dl class="garantias">
    <div *ngFor="let g of garantias; let i = index" class="garantia" appAparece [retraso]="i * 80">
      <span class="indice" aria-hidden="true">0{{ i + 1 }}</span>
      <dt>{{ g.titulo }}</dt>
      <dd>{{ g.texto }}</dd>
    </div>
  </dl>

  <p class="cierre" appAparece>
    Todo está por escrito en los <a routerLink="/legal/terminos">Términos de servicio</a> y la
    <a routerLink="/legal/privacidad">Política de privacidad</a>. ¿Una duda? Te responde una persona:
    <button type="button" class="enlace" (click)="hablar.emit()">escribinos</button>.
  </p>

  <!-- Testimonios: solo reales y autorizados. Apagado mientras no haya ninguno. -->
  <ul class="testimonios" *ngIf="testimonios.length">
    <li *ngFor="let t of testimonios">
      <blockquote>“{{ t.cita }}”</blockquote>
      <p>{{ t.persona }} · {{ t.taller }}, {{ t.ciudad }}</p>
    </li>
  </ul>
</section>
