<section class="adapta" aria-labelledby="adapta-titulo">
  <h2 id="adapta-titulo" lpAparece>Se adapta a tu taller, no al revés.</h2>

  <ul class="bandas">
    <li *ngFor="let a of ajustes; let i = index" class="banda" [class.prendida]="a.prendido"
        lpAparece [retraso]="i * 70">
      <div class="texto">
        <p class="frase" [id]="'ajuste-' + i">{{ a.frase }}</p>
        <p class="consecuencia" [attr.aria-hidden]="!a.prendido">{{ a.consecuencia }}</p>
      </div>
      <button type="button" class="interruptor" data-ui role="switch"
              [attr.aria-checked]="a.prendido" [attr.aria-labelledby]="'ajuste-' + i"
              (click)="alternar(a)">
        <span class="perilla" aria-hidden="true"></span>
      </button>
    </li>
  </ul>
</section>
