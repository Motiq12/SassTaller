<section class="preguntas" aria-labelledby="preguntas-titulo">
  <div class="lado">
    <p class="rotulo" appAparece>Preguntas</p>
    <h2 id="preguntas-titulo" class="titulo" appAparece>
      <span class="l"><span style="--i: 0">Preguntas</span></span>
      <span class="l"><span style="--i: 1">frecuentes</span></span>
    </h2>
    <div class="otra" appAparece [retraso]="120">
      <p>¿Tenés otra duda? Te responde una persona.</p>
      <button type="button" class="hablar" (click)="hablar.emit()">
        Hablá con nosotros
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </button>
    </div>
  </div>

  <!-- <details> nativo: se abre con teclado y lector de pantalla, y sin script. -->
  <div class="lista" appAparece [retraso]="80">
    <details *ngFor="let p of preguntas">
      <summary>
        <span>{{ p.q }}</span>
        <span class="mas" aria-hidden="true"></span>
      </summary>
      <p>{{ p.a }}</p>
    </details>
  </div>
</section>
