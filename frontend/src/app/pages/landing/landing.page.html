<ion-content class="landing" [class.lp-js]="conScript" [scrollEvents]="false">
  <!-- Barra plana: la marca, tres enlaces y una acción. Pasa a fondo sólido al bajar. -->
  <header slot="fixed" class="barra" #barra>
    <a class="marca" routerLink="/" [attr.aria-label]="producto.nombre + ', inicio'">
      <img [src]="producto.logo" alt="" class="iso" width="28" height="28" />
      <span>{{ producto.nombre }}</span>
    </a>
    <nav aria-label="Principal">
      <button type="button" class="enlace" (click)="irA('como')">Cómo funciona</button>
      <button type="button" class="enlace" (click)="irA('precios')">Precios</button>
      <a class="enlace" routerLink="/portal/login">Entrar</a>
      <a class="accion" routerLink="/registro-taller">Probá gratis</a>
    </nav>
  </header>

  <main>
    <app-lp-hero (hablar)="irA('contacto')"></app-lp-hero>
    <app-lp-vitrina id="problemas" class="seccion"></app-lp-vitrina>
    <app-lp-etapas id="como" class="seccion"></app-lp-etapas>
    <app-lp-adapta id="adapta"></app-lp-adapta>
    <app-lp-precios id="precios" (hablar)="irA('contacto')"></app-lp-precios>
    <app-lp-cupon id="contacto"></app-lp-cupon>
  </main>
  <app-lp-pie (ir)="irA($event)"></app-lp-pie>
</ion-content>
