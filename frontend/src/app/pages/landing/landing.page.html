<ion-content class="landing" [class.lp-js]="conScript" [scrollEvents]="false">
  <!-- El marco blanco: las secciones oscuras se leen como tarjetas dentro de él. -->
  <main class="pagina" #pagina>
    <!-- El orden es el argumento de venta: la promesa, los problemas que se van, una
         orden real de punta a punta, lo que trae, lo que incluye en números, por qué
         confiar, cuánto cuesta y qué pasa a los 30 días, y las dudas. -->
    <app-lp-hero (hablar)="abrirContacto()" (menu)="abrirMenu()" (ir)="irA($event)"></app-lp-hero>
    <app-lp-vitrina id="problemas"></app-lp-vitrina>
    <app-lp-etapas id="como"></app-lp-etapas>
    <app-lp-funciones id="funciones"></app-lp-funciones>
    <app-lp-numeros id="numeros"></app-lp-numeros>
    <app-lp-confianza id="confianza" (hablar)="abrirContacto()"></app-lp-confianza>
    <app-lp-precios id="precios" (hablar)="abrirContacto()"></app-lp-precios>
    <app-lp-preguntas id="preguntas" (hablar)="abrirContacto()"></app-lp-preguntas>
    <app-lp-pie id="contacto" (ir)="irA($event)" (hablar)="abrirContacto()"></app-lp-pie>
  </main>

  <app-lp-menu [abierto]="menuAbierto" (cerrar)="cerrarMenu()"
               (ir)="cerrarMenu(); irA($event)"
               (hablar)="cerrarMenu(); abrirContacto()"></app-lp-menu>
  <app-lp-contacto [abierto]="contactoAbierto" (cerrar)="cerrarContacto()"></app-lp-contacto>
</ion-content>
