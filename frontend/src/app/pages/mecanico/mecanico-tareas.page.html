<ion-header>
  <ion-toolbar class="admin-topbar">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="admin-dark">
  <ion-refresher slot="fixed" (ionRefresh)="cargar($event)">
    <ion-refresher-content pullingIcon="chevron-down" refreshingSpinner="crescent"></ion-refresher-content>
  </ion-refresher>

  <div class="pg">
    <header class="pg-cab">
      <div>
        <h1>Tareas pendientes</h1>
        <p>{{ pendientes }} sin completar</p>
      </div>
      <div class="pg-acciones">
        <button type="button" class="btn" [ngClass]="mostrarForm ? 'btn-ou' : 'btn-cr'" (click)="mostrarForm = !mostrarForm">
          <ion-icon [name]="mostrarForm ? 'close-outline' : 'add-outline'"></ion-icon> {{ mostrarForm ? 'Cancelar' : 'Nueva tarea' }}
        </button>
      </div>
    </header>

    <!-- Nueva tarea -->
    <section class="cd pg-card mt-form" *ngIf="mostrarForm">
      <div class="pg-card-cab"><span class="cd-title"><ion-icon name="add-circle-outline"></ion-icon> Nueva tarea</span></div>
      <div class="fg">
        <label for="mt-titulo">¿Qué hay que hacer?</label>
        <input id="mt-titulo" type="text" [(ngModel)]="nueva.titulo" name="titulo">
      </div>
      <div class="fg-row">
        <div class="fg">
          <label for="mt-detalle">Detalle (opcional)</label>
          <input id="mt-detalle" type="text" [(ngModel)]="nueva.detalle" name="detalle">
        </div>
        <div class="fg">
          <label for="mt-prio">Prioridad</label>
          <select id="mt-prio" [(ngModel)]="nueva.prioridad" name="prioridad">
            <option value="normal">Normal</option>
            <option value="alta">Alta</option>
          </select>
        </div>
      </div>
      <button type="button" class="btn btn-cr btn-block" (click)="agregar()" [disabled]="guardando">{{ guardando ? 'Guardando…' : 'Agregar tarea' }}</button>
    </section>

    <!-- Cargando -->
    <div class="mt-lista" *ngIf="cargando">
      <div class="sk-dark" style="height:68px"></div>
      <div class="sk-dark" style="height:68px"></div>
    </div>

    <!-- Lista -->
    <div class="mt-lista" *ngIf="!cargando">
      <div class="mt-tarea" [class.alta]="esAlta(t)" [class.hecha]="t.hecha" *ngFor="let t of tareas">
        <button type="button" class="mt-check" [class.on]="t.hecha" (click)="toggle(t)" [attr.aria-pressed]="t.hecha"
                [attr.aria-label]="(t.hecha ? 'Marcar pendiente: ' : 'Marcar hecha: ') + t.titulo">
          <ion-icon name="checkmark" *ngIf="t.hecha"></ion-icon>
        </button>
        <button type="button" class="mt-cuerpo" (click)="toggle(t)">
          <span class="mt-titulo">
            {{ t.titulo }}
            <span class="bg" [ngClass]="t.prioridad === 'urgente' ? 'bg-rd' : 'bg-am'" *ngIf="prioLabel(t) && !t.hecha">{{ prioLabel(t) }}</span>
          </span>
          <span class="mt-detalle" *ngIf="t.detalle">{{ t.detalle }}</span>
          <span class="mt-meta" *ngIf="t.asignado_por || t.vence">
            <span class="bg bg-in" *ngIf="t.asignado_por"><ion-icon name="person-outline"></ion-icon> {{ t.asignado_por_nombre || 'Jefe' }}</span>
            <span class="bg" [ngClass]="vencida(t) ? 'bg-rd' : 'bg-n'" *ngIf="t.vence"><ion-icon name="calendar-outline"></ion-icon> {{ t.vence | date:'dd/MM' }}</span>
          </span>
        </button>
        <button type="button" class="mt-x" *ngIf="!t.asignado_por" (click)="eliminar(t)" [attr.aria-label]="'Eliminar ' + t.titulo"><ion-icon name="trash-outline"></ion-icon></button>
      </div>

      <div class="pg-vacio" *ngIf="!tareas.length">
        <ion-icon name="checkmark-done-circle-outline"></ion-icon> No tenés tareas. ¡Todo al día!
      </div>
    </div>
  </div>
</ion-content>
