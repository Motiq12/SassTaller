<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Motiq · Gestión de talleres</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />

  <!-- Fuentes (Outfit / Plus Jakarta Sans / JetBrains Mono): carga no bloqueante -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" />
  </noscript>
  <!-- Se permite el zoom con los dedos. El valor por defecto de Ionic lleva
       `user-scalable=no, maximum-scale=1`, que Lighthouse marca como falla de
       accesibilidad en TODAS las pantallas: alguien con baja visión no puede ampliar.
       Chocaba además con que la propia app ofrezca ajuste de tamaño de texto. -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/logo/motiq-iso.png" />
  <meta name="theme-color" content="#1e3a5f" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Motiq" />
  <link rel="apple-touch-icon" href="assets/logo/motiq-iso.png" />

  <!-- Pantalla de arranque ("Pulso mínimo"): cubre el instante entre el HTML
       inicial y la primera pantalla real de Angular (tanto en web como justo
       después del splash nativo en la app). Mismo carmesí que el splash nativo
       (capacitor.config.ts) para que la transición sea continua, sin salto de color. -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #1e3a5f;
      /* Fondo con un poco de profundidad: un halo apenas más claro arriba evita que
         el azul plano se vea como una pantalla trabada. */
      background-image: radial-gradient(120% 80% at 50% 12%, #26496f 0%, #1e3a5f 55%);
      transition: opacity .35s ease;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }

    .boot-marca {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transform: translateY(6px) scale(.98);
      animation: boot-entrar .7s cubic-bezier(.2, .7, .3, 1) .06s forwards;
    }

    /* Placa clara detrás del isotipo: el logo es azul marino y sobre este fondo
       desaparecería. Así alcanza UN solo archivo para el favicon, el ícono de la app
       instalada y esta pantalla. */
    .boot-mark {
      width: 76px;
      height: 76px;
      background: #ffffff;
      border-radius: 20px;
      padding: 12px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
      /* Oculto hasta que la imagen cargue de verdad: si el archivo no existe, el
         navegador pinta su ícono de imagen rota, que es justo lo que no queremos
         en la primera pantalla del producto. El script de abajo lo revela. */
      display: none;
    }

    .boot-nombre {
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .01em;
      color: #ffffff;
      line-height: 1;
    }

    /* Barra indeterminada: no promete un porcentaje que no sabemos, solo comunica
       que algo está pasando. Es más honesta que una rueda girando sin fin. */
    .boot-barra {
      position: relative;
      width: 132px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .16);
      overflow: hidden;
      opacity: 0;
      animation: boot-entrar .5s ease .28s forwards;
    }
    .boot-barra::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: #ffffff;
      animation: boot-correr 1.15s cubic-bezier(.65, .05, .36, 1) infinite;
    }

    @keyframes boot-entrar {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes boot-correr {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(238%); }
    }

    /* Recarga (misma sesión, ver script abajo): más corta — ya viste el arranque
       completo hace un momento, no hace falta repetirlo entero. */
    #boot-splash.recarga .boot-marca { animation-duration: .4s; }

    @media (prefers-reduced-motion: reduce) {
      .boot-marca, .boot-barra { animation-duration: .01ms !important; opacity: 1; transform: none; }
      /* La barra deja de correr y queda como una línea de progreso quieta: el
         movimiento continuo es justo lo que molesta a quien pide menos animación. */
      .boot-barra::after { animation: none; width: 100%; opacity: .5; }
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-marca">
      <img class="boot-mark" src="assets/logo/motiq-iso.png" alt=""
           onload="this.style.display='block'" onerror="this.remove()" />
      <div class="boot-nombre">Motiq</div>
    </div>
    <div class="boot-barra"></div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('boot-splash');
      if (!el) return;
      // Primera carga de la sesión = apertura real de la app (respiro completo,
      // 1.6s). Si sessionStorage ya tenía la marca, es una recarga (F5, o volver a
      // cargar sin cerrar del todo la app): más corta, 0.9s. Se decide ANTES de que
      // arranque la animación, para que CSS y el mínimo de espera queden en sync.
      var esRecarga = false;
      try {
        esRecarga = sessionStorage.getItem('tallerms_boot_visto') === '1';
        sessionStorage.setItem('tallerms_boot_visto', '1');
      } catch (e) { /* modo privado sin sessionStorage: siempre cuenta como apertura */ }
      if (esRecarga) el.classList.add('recarga');

      var inicio = Date.now();
      // En el teléfono, con los assets locales, Angular puede arrancar y navegar
      // casi al instante — sin este mínimo, la animación se corta a mitad y se
      // siente como un parpadeo. Se sostiene lo que falte para completar el respiro.
      var MOSTRAR_MIN_MS = esRecarga ? 900 : 1600;
      var hidden = false;
      function ocultarYa() {
        if (hidden) return;
        hidden = true;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 400);
      }
      function hide() {
        var faltan = MOSTRAR_MIN_MS - (Date.now() - inicio);
        if (faltan > 0) { setTimeout(ocultarYa, faltan); } else { ocultarYa(); }
      }
      window.__hideBootSplash = hide;
      // Salvavidas: si algo falla al iniciar Angular, no dejar la pantalla trabada.
      setTimeout(ocultarYa, 4000);
    })();
  </script>
  <app-root></app-root>
</body>

</html>
